name: QA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

env:
  ERZA_BASE_URL: ${{ secrets.ERZA_BASE_URL || 'https://dev.erza.ai' }}
  BASE_URL: ${{ secrets.BASE_URL || 'https://api.dev.erza.ai/' }}
  AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL || 'https://api.dev.erza.ai/' }}
  STREAM_URL: ${{ secrets.STREAM_URL || 'https://ai.dev.erza.ai/api/article/template/stream' }}

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 1. Auto login (+ auto-signup fallback) -> saves .auth/user.json
      - name: auto login / signup
        run: npx playwright test --project=auth
        env:
          ERZA_EMAIL: ${{ secrets.ERZA_EMAIL }}
          ERZA_PASSWORD: ${{ secrets.ERZA_PASSWORD }}
      # 2. Authenticated E2E (reuses saved session)
      - name: e2e tests
        if: always()
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  k6-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k6 (grafana/k6 release binary)
        run: |
          set -euo pipefail
          curl -sL https://github.com/grafana/k6/releases/download/v2.4.0/k6-v2.4.0-linux-amd64.tar.gz | tar -xz
          sudo mv ./k6-v2.4.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: k6 smoke (login + Collection/User CRUD)
        run: k6 run -e ERZA_BASE_URL="$ERZA_BASE_URL" -e ERZA_EMAIL="$ERZA_EMAIL" -e ERZA_PASSWORD="$ERZA_PASSWORD" k6/smoke.js
        env:
          ERZA_EMAIL: ${{ secrets.ERZA_EMAIL }}
          ERZA_PASSWORD: ${{ secrets.ERZA_PASSWORD }}

  k6-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k6 (grafana/k6 release binary)
        run: |
          set -euo pipefail
          curl -sL https://github.com/grafana/k6/releases/download/v2.4.0/k6-v2.4.0-linux-amd64.tar.gz | tar -xz
          sudo mv ./k6-v2.4.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: k6 streaming load (SSE via X-API-Key)
        run: k6 run -e API_KEY="$API_KEY" -e STREAM_URL="$STREAM_URL" k6/load/load_test.js
        env:
          API_KEY: ${{ secrets.API_KEY }}
